<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B7285">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OnTraining">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>OnTraining Floripa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: coluna única estilo app de celular — cabeçalho com data e contagem, abas Hoje/Histórico, cartões de treino e refeições, popup de execução */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --ink:#0F1E24; --muted:#5A6D74; --line:#D6E0E3;
  --accent:#0B7285; --accent-ink:#FFFFFF; --accent-soft:#DDEFF2;
  --good:#2F7D46; --good-soft:#E0F1E5; --warn:#9A6414; --warn-soft:#F7ECD8;
  --scrim:rgba(8,20,24,.55);
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1215; --surface:#111C20; --ink:#E4EDEF; --muted:#8FA3A9; --line:#223239;
  --accent:#3FB4C5; --accent-ink:#05262B; --accent-soft:#12303A;
  --good:#63C483; --good-soft:#15301F; --warn:#E2B25C; --warn-soft:#33270F; --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1215; --surface:#111C20; --ink:#E4EDEF; --muted:#8FA3A9; --line:#223239;
  --accent:#3FB4C5; --accent-ink:#05262B; --accent-soft:#12303A;
  --good:#63C483; --good-soft:#15301F; --warn:#E2B25C; --warn-soft:#33270F; --scrim:rgba(0,0,0,.65); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:14px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wrap>*{min-width:0;max-width:100%}
.panes{display:grid;gap:14px}
.pane{display:flex;flex-direction:column;gap:14px;min-width:0}
.jump{display:none}
@media (max-width:759px){.p-treino{order:1}.p-viagem{order:2}.p-ref{order:3}.p-peso{order:4}}
@media (min-width:760px){
  .panes{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch}
  .pane > .card{flex:1}
  .p-treino .card > .row:last-child{margin-top:auto}
  body header.top{flex-wrap:nowrap;align-items:center}
  body header.top > .tabs{flex:0 1 320px;order:0}
  body .date{font-size:2rem}
  body .date > small{display:inline;margin:0 8px 0 0}
}

h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header.top .tabs{order:3;flex:1 1 100%}
.date{font-family:var(--f-display);font-weight:700;font-size:2.4rem;line-height:.95;letter-spacing:.01em;text-transform:uppercase}
.date small{display:block;font-family:var(--f-body);font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.08em;margin-bottom:4px}
.trip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;display:flex;align-items:center;gap:6px}
.trip b{font-family:var(--f-mono);font-size:.95rem;color:var(--accent)}

.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wtitle{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1;text-transform:uppercase}
.wfoco{color:var(--muted);font-size:.9rem}
.small{font-size:.82rem}
.why{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.88rem}
.note{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.88rem}
.note b{color:var(--warn)}

/* Carrosséis de exercícios e refeições */
.car-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.car-nav{display:flex;gap:6px}
.arrow{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;line-height:1;display:grid;place-items:center;padding:0 0 2px;color:var(--ink)}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px;padding-block:2px}
.carousel::-webkit-scrollbar{display:none}
.item{flex:0 0 min(78%,300px);scroll-snap-align:start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dots{display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s,background .2s}
.dots i.on{width:16px;background:var(--accent)}
@media (prefers-reduced-motion:reduce){.dots i{transition:none}}
.ex-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ord{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1;color:var(--accent)}
.ex .n{font-weight:700;font-size:1rem;line-height:1.25;min-height:2.5em}
.ex .s{font-family:var(--f-mono);font-size:.85rem;color:var(--ink)}
.ex .load{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);margin-top:auto;padding-top:4px}
.ex .load input{width:76px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--f-mono);font-size:.85rem}
.ex .last{font-size:.78rem;color:var(--muted)}
.demo{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px 6px 8px;font-size:.8rem;font-weight:600;color:var(--accent);white-space:nowrap}
.demo svg{width:14px;height:14px}

.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.grow{flex:1}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px}
.status.done{background:var(--good-soft);color:var(--good)}
.status.skip{background:var(--warn-soft);color:var(--warn)}
.status.todo{background:var(--accent-soft);color:var(--accent)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--bg)}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--line)}

.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macro{display:flex;flex-direction:column;gap:4px;min-width:0}
.macro span{font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.macro b{font-family:var(--f-mono);font-size:.92rem}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

.meal .meal-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meal .slot{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meal .kc{font-size:.8rem;color:var(--accent)}
.meal .mt{font-weight:700;font-size:1rem}
.meal ul{margin:0;padding-left:18px;font-size:.88rem}
.meal li{margin-block:1px}
.meal .mm{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.meal-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.chkbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 11px;font-size:.82rem;font-weight:600}
.chkbtn[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.chkbtn svg{width:14px;height:14px}
.swap{border:0;background:transparent;color:var(--accent);font-size:.82rem;font-weight:600;padding:4px 2px}
.meal.eaten .mt,.meal.eaten ul{color:var(--muted)}
.meal.eaten{border-color:var(--good)}
.weight{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.weight input{width:96px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-family:var(--f-mono)}
.weight .avg{font-size:.85rem;color:var(--muted)}

.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding-block:11px;border-top:1px solid var(--line);align-items:center}
.hrow:first-child{border-top:0}
.hrow .d{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1;text-transform:uppercase}
.hrow .d small{display:block;font-family:var(--f-body);font-size:.7rem;color:var(--muted);font-weight:600;margin-top:3px}
.hrow .w{font-weight:600;min-width:0}
.hrow .m{font-size:.8rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.settings input{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.saved{font-size:.8rem;color:var(--muted)}
.saved svg{color:var(--good)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.foot{font-size:.78rem;color:var(--muted);text-align:center}

/* Popup de execução */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
.sheet{background:var(--surface);color:var(--ink);border-radius:18px;width:100%;max-width:520px;max-height:calc(100% - 24px);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.modal{align-items:center}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head h3{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1;text-transform:uppercase}
.close{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;flex:none;padding:0}
.close svg{width:16px;height:16px}
.stage{background:var(--bg);border-radius:12px;border:1px solid var(--line);display:flex;justify-content:center}
.stage canvas{width:100%;max-width:340px;aspect-ratio:4/3;display:block}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.steps li::marker{font-family:var(--f-mono);color:var(--accent);font-weight:500}
.yt{color:var(--accent);font-weight:600;text-decoration:none}
.yt:hover{text-decoration:underline}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <h1 class="date"><small id="dow">HOJE</small><span id="dateMain">—</span></h1>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabHoje" aria-selected="true">Hoje</button>
      <button role="tab" id="tabHist" aria-selected="false">Histórico</button>
    </div>
    <div class="trip">Viagem: <b id="tripDays">defina a data</b></div>
  </header>

  <main id="viewHoje" class="wrap"></main>
  <main id="viewHist" class="wrap" hidden></main>

  <p class="foot" id="storeInfo">Carregando…</p>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet">
    <div class="sheet-head">
      <div><div class="eyebrow" id="mSets">—</div><h3 id="mTitle">—</h3></div>
      <button class="close" id="mClose" aria-label="Fechar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
    </div>
    <div class="stage"><canvas id="mCanvas" width="400" height="300" aria-label="Animação do movimento"></canvas></div>
    <div><div class="eyebrow" style="margin-bottom:6px">Como fazer</div><ol class="steps" id="mSteps"></ol></div>
    <div class="note" id="mErro"></div>
    <a class="yt" id="mYt" href="#" target="_blank" rel="noopener">Ver vídeos desse exercício no YouTube ↗</a>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= TREINOS ================= */
/* cada exercício: [[variações], "séries", semCarga?] — o padrão de movimento vem de PADRAO_DO_EXERCICIO */
const TREINOS = {
  supA:{nome:"Superior A",foco:"Peito, costas e ombro",tipo:"forca",ex:[
    [["Supino reto com barra","Supino reto com halter"],"4×8–10"],
    [["Remada curvada com barra","Remada baixa na polia"],"4×8–10"],
    [["Supino inclinado com halter","Supino inclinado na máquina"],"3×10–12"],
    [["Puxada frontal aberta","Puxada frontal pegada neutra"],"3×10–12"],
    [["Elevação lateral com halter","Elevação lateral na polia"],"3×12–15"],
    [["Tríceps na polia com corda","Tríceps francês com halter"],"3×12–15"]]},
  infA:{nome:"Inferior A",foco:"Quadríceps e glúteo",tipo:"forca",ex:[
    [["Agachamento livre","Agachamento no smith"],"4×8–10"],
    [["Leg press 45°","Hack squat"],"3×10–12"],
    [["Afundo com halter","Agachamento búlgaro"],"3×10 cada perna"],
    [["Cadeira extensora","Cadeira extensora unilateral"],"3×12–15"],
    [["Panturrilha em pé","Panturrilha no leg press"],"4×12–15"]]},
  cardio:{nome:"Intervalado + abdômen",foco:"Cardio intenso e core",tipo:"cardio",ex:[
    [["Intervalado na bike","Intervalado na esteira"],"20–30 min · 30 s forte / 90 s leve",1],
    [["Prancha"],"3×40–60 s",1],
    [["Elevação de pernas","Abdominal infra no banco"],"3×12–15",1],
    [["Abdominal na polia","Crunch no solo"],"3×15"],
    [["Prancha lateral"],"2×30 s cada lado",1]]},
  supB:{nome:"Superior B",foco:"Costas, ombro e braço",tipo:"forca",ex:[
    [["Barra fixa pegada fechada","Puxada pegada fechada"],"4×8–10"],
    [["Desenvolvimento com halter","Desenvolvimento na máquina"],"3×8–10"],
    [["Remada unilateral com halter","Remada cavalinho"],"3×10–12"],
    [["Crucifixo com halter","Peck deck"],"3×12–15"],
    [["Rosca direta com barra","Rosca alternada com halter"],"3×10–12"],
    [["Elevação lateral com halter","Elevação lateral na polia"],"3×12–15"]]},
  infB:{nome:"Inferior B",foco:"Posterior, glúteo e abdômen",tipo:"forca",ex:[
    [["Levantamento terra romeno com barra","Terra romeno com halter"],"4×8–10"],
    [["Elevação pélvica com barra","Elevação pélvica na máquina"],"4×10–12"],
    [["Mesa flexora","Cadeira flexora"],"3×12"],
    [["Cadeira abdutora"],"3×15"],
    [["Panturrilha sentado"],"3×15"],
    [["Prancha"],"3×45 s",1],
    [["Abdominal na polia","Crunch no solo"],"3×15"]]},
  longo:{nome:"Cardio longo",foco:"Queima de gordura em ritmo leve",tipo:"cardio",ex:[
    [["Caminhada inclinada na esteira","Bike ergométrica","Corrida leve ao ar livre"],"40–60 min leve a moderado",1],
    [["Alongamento geral"],"10 min",1]]},
  descanso:{nome:"Descanso",foco:"Recuperação ativa",tipo:"descanso",ex:[
    [["Caminhada leve"],"8–10 mil passos no dia",1],
    [["Mobilidade de quadril e ombro"],"10 min",1]]}
};
const ROTACAO = ["supA","infA","cardio","supB","infB","longo","descanso"];

const PADRAO_DO_EXERCICIO = {
  "Supino reto com barra":"supino","Supino reto com halter":"supinoH",
  "Supino inclinado com halter":"inclinado","Supino inclinado na máquina":"inclinado",
  "Remada curvada com barra":"remada","Remada unilateral com halter":"remadaUni","Remada cavalinho":"remada",
  "Remada baixa na polia":"remadaBaixa",
  "Puxada frontal aberta":"puxada","Puxada frontal pegada neutra":"puxada","Puxada pegada fechada":"puxada",
  "Barra fixa pegada fechada":"barra",
  "Elevação lateral com halter":"lateral","Elevação lateral na polia":"lateral",
  "Tríceps na polia com corda":"tricepsPolia","Tríceps francês com halter":"frances",
  "Agachamento livre":"agachamento","Agachamento no smith":"agachamento","Hack squat":"agachamento",
  "Leg press 45°":"legpress","Panturrilha no leg press":"legpressPant",
  "Afundo com halter":"afundo","Agachamento búlgaro":"bulgaro",
  "Cadeira extensora":"extensora","Cadeira extensora unilateral":"extensora",
  "Panturrilha em pé":"panturrilha","Panturrilha sentado":"pantSentado",
  "Desenvolvimento com halter":"desenvolvimento","Desenvolvimento na máquina":"desenvolvimento",
  "Crucifixo com halter":"crucifixo","Peck deck":"crucifixo",
  "Rosca direta com barra":"rosca","Rosca alternada com halter":"roscaH",
  "Levantamento terra romeno com barra":"terra","Terra romeno com halter":"terraH",
  "Elevação pélvica com barra":"pelvica","Elevação pélvica na máquina":"pelvica",
  "Mesa flexora":"flexora","Cadeira flexora":"flexora","Cadeira abdutora":"abdutora",
  "Prancha":"prancha","Prancha lateral":"pranchaLateral",
  "Elevação de pernas":"elevPernas","Abdominal infra no banco":"elevPernas",
  "Abdominal na polia":"abPolia","Crunch no solo":"crunch",
  "Intervalado na bike":"bike","Bike ergométrica":"bike",
  "Intervalado na esteira":"caminhada","Caminhada inclinada na esteira":"caminhada","Corrida leve ao ar livre":"caminhada","Caminhada leve":"caminhada",
  "Alongamento geral":"alongamento","Mobilidade de quadril e ombro":"alongamento"
};

/* Instruções por padrão de movimento */
const DICAS = {
  supino:{p:["Deite com os olhos embaixo da barra e os pés firmes no chão.","Aperte as escápulas para trás e segure a barra um pouco mais aberta que os ombros.","Desça controlando até encostar no meio do peito e empurre de volta até esticar os braços."],e:"Tirar o quadril do banco ou deixar a barra quicar no peito."},
  supinoH:{p:["Deite com um halter em cada mão na linha do peito.","Mantenha as escápulas apertadas e os cotovelos a uns 45° do corpo.","Empurre os halteres para cima até quase se encostarem e desça devagar."],e:"Abrir demais os cotovelos (em 90°), o que força o ombro."},
  inclinado:{p:["Ajuste o banco entre 30° e 45°.","Comece com os pesos na altura da parte de cima do peito.","Empurre para cima e desça devagar, sem perder o contato das costas com o banco."],e:"Banco inclinado demais, que tira o trabalho do peito e joga para o ombro."},
  remada:{p:["Incline o tronco à frente, com as costas retas e os joelhos levemente dobrados.","Deixe o peso pendurado com os braços esticados.","Puxe em direção ao umbigo levando os cotovelos para trás e desça controlando."],e:"Arredondar a lombar ou usar impulso do tronco para subir o peso."},
  remadaUni:{p:["Apoie um joelho e a mão do mesmo lado no banco.","Com as costas retas, deixe o halter pendurado.","Puxe o halter em direção ao quadril, com o cotovelo rente ao corpo, e desça devagar."],e:"Girar o tronco para subir o halter."},
  remadaBaixa:{p:["Sente com os pés na plataforma e os joelhos levemente dobrados.","Segure o puxador com o tronco reto e os braços esticados.","Puxe até a barriga, apertando as escápulas, e volte controlando."],e:"Balançar o tronco para frente e para trás a cada repetição."},
  puxada:{p:["Sente e prenda as coxas embaixo do apoio.","Segure a barra e incline o tronco um pouco para trás.","Puxe até a parte de cima do peito, levando os cotovelos para baixo, e suba devagar."],e:"Puxar a barra atrás da nuca ou usar o corpo inteiro para descer o peso."},
  barra:{p:["Pendure-se na barra com as mãos na largura dos ombros.","Contraia o abdômen e aperte as escápulas para baixo.","Suba até o queixo passar da barra e desça até esticar os braços."],e:"Balançar as pernas para ganhar impulso. Se não conseguir, use o elástico ou a máquina."},
  lateral:{p:["Em pé, com um peso em cada mão ao lado do corpo.","Com os cotovelos levemente dobrados, suba os braços para os lados.","Pare na altura dos ombros e desça devagar."],e:"Subir acima dos ombros ou usar o tronco para jogar o peso."},
  tricepsPolia:{p:["Fique de frente para a polia com os cotovelos colados ao corpo.","Estique os braços para baixo, abrindo a corda no final.","Volte até a altura do peito sem mexer os cotovelos."],e:"Deixar os cotovelos irem para frente, o que tira o trabalho do tríceps."},
  frances:{p:["Segure um halter com as duas mãos acima da cabeça.","Mantenha os cotovelos apontados para cima e perto da cabeça.","Desça o halter atrás da cabeça e suba esticando os braços."],e:"Abrir os cotovelos para os lados."},
  agachamento:{p:["Pés na largura dos ombros, pontas levemente para fora.","Desça levando o quadril para trás, como se fosse sentar, com o peito aberto.","Desça até as coxas ficarem paralelas ao chão e suba empurrando o chão."],e:"Joelhos caindo para dentro ou calcanhares saindo do chão."},
  legpress:{p:["Sente com as costas e o quadril encostados no banco.","Pés na largura dos ombros, no meio da plataforma.","Desça até os joelhos formarem 90° e empurre sem travar os joelhos no final."],e:"Descer demais a ponto de o quadril sair do banco."},
  legpressPant:{p:["Apoie só a ponta dos pés na parte de baixo da plataforma.","Com as pernas quase esticadas, deixe os calcanhares descerem.","Empurre com a ponta dos pés o máximo que der e segure 1 segundo."],e:"Dobrar os joelhos a cada repetição, o que tira o trabalho da panturrilha."},
  afundo:{p:["Em pé, com um halter em cada mão.","Dê um passo à frente e desça até o joelho de trás quase tocar o chão.","Empurre com a perna da frente para subir."],e:"Joelho da frente passando muito da ponta do pé ou tronco caindo para frente."},
  bulgaro:{p:["Apoie o peito do pé de trás em um banco.","Com a perna da frente um passo à frente, desça reto.","Desça até a coxa da frente ficar paralela ao chão e suba empurrando com o calcanhar."],e:"Pé da frente muito perto do banco, o que desequilibra."},
  extensora:{p:["Sente com as costas apoiadas e o rolo acima dos tornozelos.","Estique as pernas até ficarem retas.","Segure 1 segundo em cima e desça devagar."],e:"Soltar o peso de uma vez na descida."},
  panturrilha:{p:["Em pé, com a ponta dos pés em um degrau ou no chão.","Suba na ponta dos pés o máximo possível.","Segure 1 segundo e desça até esticar a panturrilha."],e:"Fazer rápido e curto, sem amplitude."},
  pantSentado:{p:["Sente com o apoio em cima dos joelhos e a ponta dos pés na plataforma.","Suba os calcanhares o máximo possível.","Desça devagar até sentir alongar."],e:"Quicar no fundo do movimento."},
  desenvolvimento:{p:["Sente com as costas apoiadas e os pesos na altura dos ombros.","Empurre para cima até quase esticar os braços.","Desça controlando até a altura das orelhas."],e:"Arquear muito a lombar para subir o peso."},
  crucifixo:{p:["Com os braços abertos e os cotovelos levemente dobrados.","Feche os braços à frente como se abraçasse uma árvore.","Aperte o peito no meio e abra devagar."],e:"Dobrar demais os cotovelos, que transforma o exercício em supino."},
  rosca:{p:["Em pé, segure a barra com as palmas para frente.","Mantenha os cotovelos colados ao corpo.","Suba a barra até perto dos ombros e desça devagar."],e:"Jogar o tronco para trás para subir o peso."},
  roscaH:{p:["Em pé, um halter em cada mão ao lado do corpo.","Suba um braço de cada vez, girando a palma para cima.","Desça devagar e alterne os braços."],e:"Cotovelo saindo do lugar e indo para frente."},
  terra:{p:["Em pé, segure a barra na frente das coxas.","Com os joelhos levemente dobrados, leve o quadril para trás e desça a barra rente às pernas.","Desça até sentir alongar atrás da coxa e suba apertando o glúteo."],e:"Arredondar as costas ou afastar a barra das pernas."},
  terraH:{p:["Em pé, um halter em cada mão na frente das coxas.","Leve o quadril para trás com as costas retas e os joelhos levemente dobrados.","Desça até sentir alongar atrás da coxa e suba apertando o glúteo."],e:"Dobrar demais os joelhos, que vira agachamento."},
  pelvica:{p:["Apoie a parte de cima das costas no banco, com a barra sobre o quadril.","Pés firmes no chão, na largura do quadril.","Suba o quadril até alinhar com o tronco, aperte o glúteo 1 segundo e desça."],e:"Arquear a lombar no topo em vez de contrair o glúteo."},
  flexora:{p:["Deite de barriga para baixo com o rolo acima dos calcanhares.","Dobre os joelhos trazendo os calcanhares em direção ao glúteo.","Desça devagar até quase esticar."],e:"Levantar o quadril do banco para ajudar."},
  abdutora:{p:["Sente com as costas apoiadas e as pernas por dentro das almofadas.","Abra as pernas o máximo que conseguir.","Segure 1 segundo e feche devagar."],e:"Soltar o peso de uma vez na volta."},
  prancha:{p:["Apoie os antebraços no chão com os cotovelos embaixo dos ombros.","Estique as pernas e fique na ponta dos pés.","Mantenha o corpo reto como uma tábua, contraindo abdômen e glúteo."],e:"Deixar o quadril cair ou empinar demais."},
  pranchaLateral:{p:["Deite de lado e apoie o antebraço embaixo do ombro.","Suba o quadril até o corpo ficar reto.","Segure o tempo indicado e troque de lado."],e:"Deixar o quadril cair em direção ao chão."},
  elevPernas:{p:["Deite de costas com as mãos ao lado do corpo.","Com as pernas esticadas, suba até formarem 90° com o chão.","Desça devagar sem encostar os pés no chão."],e:"Tirar a lombar do chão. Se acontecer, dobre um pouco os joelhos."},
  abPolia:{p:["Ajoelhe de frente para a polia, segurando a corda perto da cabeça.","Enrole o tronco para baixo, levando os cotovelos em direção aos joelhos.","Volte devagar sem sentar nos calcanhares."],e:"Puxar com os braços em vez de enrolar a coluna."},
  crunch:{p:["Deite de costas com os joelhos dobrados e os pés no chão.","Mãos atrás da cabeça, sem puxar o pescoço.","Suba os ombros do chão contraindo o abdômen e desça devagar."],e:"Puxar a cabeça com as mãos."},
  bike:{p:["Ajuste o banco para a perna ficar quase esticada embaixo.","No intervalado: 30 s o mais forte que conseguir e 90 s leve.","Repita até completar o tempo e termine com 3 min leves."],e:"Carga tão leve no tiro forte que não chega a cansar."},
  caminhada:{p:["Comece 3 min em ritmo leve para aquecer.","Na esteira, use 8–12% de inclinação sem segurar no apoio.","Mantenha um ritmo em que ainda dá para falar frases curtas."],e:"Segurar na esteira, o que reduz muito o gasto."},

const anim={raf:0,pat:null,t0:0};
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function drawFrame(now){
  const cv=$("#mCanvas"), ctx=cv.getContext("2d"), pat=anim.pat; if(!pat) return;
  const dpr=Math.min(2,window.devicePixelRatio||1), W=cv.clientWidth||340, H=W*0.75;
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const sc=cv.width/200; ctx.setTransform(sc,0,0,sc,0,0); ctx.clearRect(0,0,200,150);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches, time=(now-anim.t0)/1000*(reduce?0.5:1);
  const k = pat.fn ? pat.fn(time*(pat.speed||3)) : lerpPose(pat.A,pat.B,(1-Math.cos(time*2*Math.PI/2.6))/2);
  const J=solve(pat,k), ink=cssVar("--ink"), mut=cssVar("--muted"), line=cssVar("--line"), acc=cssVar("--accent");
  ctx.lineCap="round"; ctx.lineJoin="round";
  const seg=(pts,c,w)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(...pts[0]);for(const q of pts.slice(1))ctx.lineTo(...q);ctx.stroke();};
  if(!pat.noGround){ seg([[8,141],[192,141]],line,2); }
  const props=pat.props||[], dyn=["plate","db","pad"];
  for(const pr of props){ if(dyn.includes(pr.k)) continue;
    if(pr.k==="rect"){ctx.fillStyle=line;ctx.fillRect(pr.x,pr.y,pr.w,pr.h);}
    else if(pr.k==="line") seg([pr.a,pr.b],line,pr.w||4);
    else if(pr.k==="circle"){ctx.strokeStyle=mut;ctx.lineWidth=2;ctx.beginPath();ctx.arc(pr.c[0],pr.c[1],pr.r,0,7);ctx.stroke();}
    else if(pr.k==="cable") seg([pr.a,J[pr.to]],mut,1.2);
  }
  // membros de trás
  seg([J.hp2,J.k2,J.a2,J.t2],pat.front?ink:mut,5.5);
  seg([J.s2,J.e2,J.w2],pat.front?ink:mut,5);
  // tronco e cabeça
  seg([J.p,J.neck],ink,7);
  if(pat.front) seg([J.s1,J.s2],ink,6);
  if(pat.front) seg([J.hp1,J.hp2],ink,6);
  ctx.fillStyle=ink; ctx.beginPath(); ctx.arc(J.head[0],J.head[1],7,0,7); ctx.fill();
  // membros da frente
  seg([J.hp1,J.k1,J.a1,J.t1],ink,5.5);
  seg([J.s1,J.e1,J.w1],ink,5);
  for(const pr of props){ if(!dyn.includes(pr.k)) continue; const at=J[pr.at]; if(!at) continue;
    if(pr.k==="plate"){ctx.fillStyle=acc;ctx.beginPath();ctx.arc(at[0],at[1],pr.r,0,7);ctx.fill();}
    else if(pr.k==="db"){ctx.fillStyle=acc;ctx.beginPath();ctx.roundRect?ctx.roundRect(at[0]-7,at[1]-3.5,14,7,3):ctx.rect(at[0]-7,at[1]-3.5,14,7);ctx.fill();}
    else if(pr.k==="pad"){const r=pr.ang*Math.PI/180,l=pr.len/2;seg([[at[0]-l*Math.cos(r),at[1]-l*Math.sin(r)],[at[0]+l*Math.cos(r),at[1]+l*Math.sin(r)]],mut,4);}
  }
  anim.raf=requestAnimationFrame(drawFrame);
}

function macrosItem(key,q){const a=ALIM[key];return {k:a.k*q,p:a.p*q,g:a.g*q,c:a.c*q};}
function arred(key,q){const a=ALIM[key]; if(a.un) return Math.max(1,Math.round(q)); const st=a.step||10; return Math.max(st,Math.round(q/st)*st);}
function montarRefeicao(slot,id,alvo,protAlvo){
  const op=REF[slot].op.find(o=>o[0]===id); if(!op) return null;
  const itens=op[2]; let fix={k:0,p:0}, P={k:0,p:0}, G={k:0,p:0};
  for(const [k,q,r] of itens){ const m=macrosItem(k,q); const b=r===1?P:r===2?G:fix; b.k+=m.k; b.p+=m.p; }
  let fp=1, fg=1;
  if(alvo){
    const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
    fp = P.p ? clamp((protAlvo-fix.p-G.p)/P.p,0.6,2) : 1;
    fg = G.k ? clamp((alvo-fix.k-fp*P.k)/G.k,0.4,3) : 1;
    if(P.k) fp = clamp((alvo-fix.k-fg*G.k)/P.k,0.6,2.2);
  }
  const out=[], tot={k:0,p:0,g:0,c:0};
  for(const [k,q,r] of itens){ const qq=r===1?arred(k,q*fp):r===2?arred(k,q*fg):q; const m=macrosItem(k,qq); for(const x in tot) tot[x]+=m[x];
    const a=ALIM[k]; out.push(a.un?`${qq} ${qq>1?a.n[1]:a.n[0]}`:`${qq} ${a.u||"g"} de ${a.n}`); }
  for(const x in tot) tot[x]=Math.round(tot[x]);
  return {id,titulo:op[1],itens:out,tot};
}

/* ================= MOTOR DE RECOMENDAÇÃO ================= */
function diasAnteriores(){ return Object.values(state.dias).filter(d=>d.date<HOJE).sort((a,b)=>b.date.localeCompare(a.date)); }
function recomendarTreino(){
  const prev = diasAnteriores(), ultimoFeito = prev.find(d=>d.treino?.status==="feito");
  let id, motivo;
  if(!ultimoFeito){ id="supA"; motivo="Primeiro treino registrado: começando pelo início da rotação."; }
  else{
    const idx = ROTACAO.indexOf(ultimoFeito.treino.id);
    id = ROTACAO[(idx+1)%ROTACAO.length];
    const gap = daysBetween(ultimoFeito.date,HOJE);
    motivo = `Último treino concluído: ${TREINOS[ultimoFeito.treino.id].nome} (${gap===1?"ontem":`há ${gap} dias`}). Próximo da sequência: ${TREINOS[id].nome}.`;
    let seguidos=0; for(const d of prev){ if(d.treino?.status==="feito" && d.treino.id!=="descanso") seguidos++; else break; }
    if(seguidos>=6 && id!=="descanso"){ id="descanso"; motivo="Você treinou 6 dias seguidos. Hoje é descanso para o corpo recuperar."; }
    if(gap>=3 && id==="descanso"){ id="supA"; motivo=`Você está há ${gap} dias sem treinar, então o descanso fica para depois. Volte pelo Superior A.`; }
  }
  return {id,motivo};
}
const variante = id => diasAnteriores().filter(d=>d.treino?.status==="feito"&&d.treino.id===id).length;
const ultimasCargas = id => { const p=diasAnteriores().find(d=>d.treino?.status==="feito"&&d.treino.id===id&&d.treino.cargas); return p?p.treino:null; };
function comidasRecentes(){
  const set=new Set();
  diasAnteriores().filter(d=>daysBetween(d.date,HOJE)<=JANELA_REPETICAO).forEach(d=>Object.values(d.refeicoes||{}).forEach(r=>{ if(r.feito) set.add(r.id); }));
  return set;
}
function recomendarRefeicao(slot){
  const ops=REF[slot].op, rec=comidasRecentes();
  let elig=ops.filter(o=>!rec.has(o[0])); if(!elig.length) elig=ops;
  return elig[(hash(HOJE+slot)+(state.rerolls[slot]||0))%elig.length][0];
}
function avisos(){
  const out=[], v=state.config.viagem;
  if(v){ const f=daysBetween(HOJE,v); if(f>=0&&f<=4) out.push("<b>Semana da viagem:</b> faça 1 série a menos em cada exercício para chegar descansado. Mantenha o sal normal e evite álcool."); }
  const pesos=Object.values(state.dias).filter(d=>d.peso), media=a=>a.reduce((s,d)=>s+d.peso,0)/a.length;
  const ult=pesos.filter(d=>daysBetween(d.date,HOJE)<7), ant=pesos.filter(d=>{const g=daysBetween(d.date,HOJE);return g>=7&&g<14;});
  if(ult.length>=3&&ant.length>=3){ const dif=media(ult)-media(ant);
    if(dif>-0.2) out.push(`<b>Peso parado:</b> a média da semana mudou ${dif.toFixed(1)} kg. Se continuar assim, tire uns 10 g de manteiga ou 40 g de queijo por dia.`);
    else if(dif<-1.1) out.push(`<b>Caindo rápido:</b> ${dif.toFixed(1)} kg na semana. Se a força estiver caindo, some 20–30 g de carboidrato antes do treino.`); }
  return out;
}

/* ================= PLANO DE HOJE ================= */
const nRefeicoes = () => state.config.nRefeicoes===3 ? 3 : 2;
const slotsDoDia = () => nRefeicoes()===3 ? ["r1","lanche","r2"] : ["r1","r2"];
function planoHoje(){
  const salvo=state.dias[HOJE], rec=recomendarTreino();
  const treinoId=state.treinoOverride || salvo?.treino?.id || rec.id;
  const refeicoes={};
  for(const slot of slotsDoDia()){
    const s=salvo?.refeicoes?.[slot], valido=s && REF[slot].op.some(o=>o[0]===s.id);
    refeicoes[slot]=(valido && !state.rerolls[slot]) ? {id:s.id,feito:!!s.feito} : {id:recomendarRefeicao(slot),feito:false};
  }
  return {treinoId, motivo:(salvo?.treino?.id && !state.treinoOverride)?null:(state.treinoOverride?"Você trocou o treino de hoje.":rec.motivo),
    status:(salvo?.treino?.id===treinoId)?salvo.treino.status||null:null, refeicoes, peso:salvo?.peso??null};
}
function detalharRefeicoes(p){
  const slots=Object.keys(p.refeicoes), out={};
  if(slots.includes("lanche")){ const l=montarRefeicao("lanche",p.refeicoes.lanche.id,null); out.lanche=l;
    const alvo=(META.kcal-l.tot.k)/2, pa=(META.p-l.tot.p)/2;
    out.r1=montarRefeicao("r1",p.refeicoes.r1.id,alvo,pa); out.r2=montarRefeicao("r2",p.refeicoes.r2.id,alvo,pa); }
  else { out.r1=montarRefeicao("r1",p.refeicoes.r1.id,META.kcal/2,META.p/2); out.r2=montarRefeicao("r2",p.refeicoes.r2.id,META.kcal/2,META.p/2); }
  return out;
}
function montarDia(p){
  const salvo=state.dias[HOJE]||{}, cargas={...(salvo.treino?.cargas||{}),...state.draft.cargas}, det=detalharRefeicoes(p);
  const refeicoes={}; for(const s in p.refeicoes) refeicoes[s]={id:p.refeicoes[s].id,feito:p.refeicoes[s].feito,titulo:det[s].titulo,kcal:det[s].tot.k};
  return {date:HOJE, treino:{id:p.treinoId,nome:TREINOS[p.treinoId].nome,variante:variante(p.treinoId),status:p.status,cargas},
    refeicoes, peso:p.peso, atualizado:new Date().toISOString()};
}

  const p=planoHoje(), t=TREINOS[p.treinoId], v=variante(p.treinoId), ult=ultimasCargas(p.treinoId);
  const treinoDia=t.tipo!=="descanso";
  const chip=p.status==="feito"?'<span class="status done">Treino feito</span>':p.status==="pulado"?'<span class="status skip">Pulado</span>':'<span class="status todo">A fazer</span>';
  const exs=t.ex.map((e,i)=>{
    const nome=e[0][v%e[0].length], ant=ult?.cargas?.[i], val=state.draft.cargas[i]??state.dias[HOJE]?.treino?.cargas?.[i]??"";
    const carga = e[2]||t.tipo!=="forca" ? "" : `<label class="load" for="kg${i}">Carga <input id="kg${i}" data-i="${i}" inputmode="decimal" placeholder="${ant?esc(ant):"kg"}" value="${esc(val)}"> kg</label>${ant?`<div class="last">Última vez: <b class="num">${esc(ant)} kg</b></div>`:""}`;
    return `<article class="item ex" aria-label="Exercício ${i+1} de ${t.ex.length}">
      <div class="ex-top"><span class="ord num">${String(i+1).padStart(2,"0")}</span>
        <button class="demo" data-demo="${esc(nome)}" data-sets="${esc(e[1])}">${PLAY}Execução</button></div>
      <div class="n">${esc(nome)}</div><div class="s">${esc(e[1])}</div>${carga}</article>`;
  }).join("");

  const det=detalharRefeicoes(p), tot={k:0,p:0,g:0,c:0};
  const nMeals=Object.keys(p.refeicoes).length;
  const meals=Object.entries(p.refeicoes).map(([slot,r],i)=>{
    const m=det[slot]; for(const x in tot) tot[x]+=m.tot[x];
    const rotulo = slot==="lanche" ? (treinoDia?"Pré-treino":"Lanche") : REF[slot].nome;
    return `<article class="item meal ${r.feito?"eaten":""}" aria-label="${rotulo}, ${i+1} de ${nMeals}">
      <div class="meal-top"><span class="slot">${rotulo}</span><span class="kc num">${m.tot.k} kcal</span></div>
      <div class="mt">${esc(m.titulo)}</div>
      <ul>${m.itens.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <div class="mm">P ${m.tot.p} g · G ${m.tot.g} g · C ${m.tot.c} g</div>
      <div class="meal-actions">
        <button class="chkbtn" data-meal="${slot}" aria-pressed="${!!r.feito}">${r.feito?CHECK+"Comi":"Marcar como feita"}</button>
        ${r.feito?"":`<button class="swap" data-swap="${slot}">Trocar</button>`}
      </div></article>`;
  }).join("");
  const mb=(lab,val,meta,un)=>`<div class="macro"><span>${lab}</span><b>${val}${un}</b><div class="bar"><i style="width:${Math.min(100,val/meta*100)}%"></i></div></div>`;
  const dicaHorario = nRefeicoes()===2
    ? (treinoDia?"Com 2 refeições, treine de 1 a 2 horas depois da 1ª. Se bater fome no meio do dia, mude para 3.":"Dia de descanso: mantenha as 2 refeições e a proteína alta.")
    : (treinoDia?"O pré-treino vai de 30 a 60 min antes de treinar.":"Dia de descanso: o lanche pode ser a qualquer hora.");

  const pesos=Object.values(state.dias).filter(d=>d.peso&&daysBetween(d.date,HOJE)<7);
  const media=pesos.length?(pesos.reduce((s,d)=>s+d.peso,0)/pesos.length).toFixed(1):null;

  const sc=$("#viewHoje .panes"), sl=sc?sc.scrollLeft:0, pos={}; document.querySelectorAll(".carousel").forEach(c=>pos[c.id]=c.scrollLeft);
  $("#viewHoje").innerHTML=`
    ${avisos().map(a=>`<div class="note">${a}</div>`).join("")}
    <div class="panes">
    <section class="pane p-treino"><div class="card" aria-labelledby="tTreino">
      <div class="row" style="justify-content:space-between;align-items:center"><span class="eyebrow">Treino de hoje</span>${chip}</div>
      <div><h2 class="wtitle" id="tTreino">${t.nome}</h2><div class="wfoco">${t.foco}${t.tipo==="forca"?` · variação ${v%2===0?"A":"B"}`:""}</div></div>
      ${p.motivo?`<div class="why">${esc(p.motivo)}</div>`:""}
      ${carrossel("carEx","Exercícios de hoje",exs,t.ex.length)}
      ${t.tipo==="forca"?`<div class="wfoco small">Descanso de 60–90 s. Termine cada série com 1–2 repetições sobrando. Tente superar a carga ou as repetições da última vez.</div>`:""}
      <div class="row">
        <button class="btn primary grow" id="btnFeito">${p.status==="feito"?"Treino salvo ✓":"Treinei"}</button>
        <button class="btn" id="btnPulei">Pulei</button>
        <button class="btn" id="btnTrocar">Trocar treino</button>
      </div>
    </div></section>


    <section class="pane p-ref"><div class="card" aria-labelledby="tRef">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2 class="eyebrow" id="tRef">Refeições de hoje</h2>
        <div class="seg" role="group" aria-label="Refeições por dia">
          <button data-n="2" aria-pressed="${nRefeicoes()===2}">2 por dia</button><button data-n="3" aria-pressed="${nRefeicoes()===3}">3 por dia</button>
        </div>
      </div>
      <div class="macros">${mb("kcal",tot.k,META.kcal,"")}${mb("Prot",tot.p,META.p," g")}${mb("Gord",tot.g,META.g," g")}${mb("Carb",tot.c,META.c," g")}</div>
      ${carrossel("carRef","Refeições de hoje",meals,nMeals)}
      <div class="wfoco small">${dicaHorario} Tudo low carb, sem glúten e com gordura só animal. As porções se ajustam para fechar ~${META.kcal} kcal, e o que você comeu nos últimos ${JANELA_REPETICAO} dias não se repete.</div>
    </div></section>

    <section class="pane p-viagem">
      <div class="card">
        <h2 class="eyebrow">Data da viagem</h2>
        <div class="settings"><label for="viagem" class="sr">Data da viagem</label><input type="date" id="viagem" value="${state.config.viagem||""}"><button class="btn" id="btnViagem">Salvar</button></div>
        <div class="saved">${state.config.viagem?`${CHECK_MINI} Salva: ${fmtData(state.config.viagem)}${(()=>{const f=daysBetween(HOJE,state.config.viagem);return f>0?` · faltam <b class="num">${f}</b> dias`:"";})()}`:"Escolha a data e ela fica salva sozinha."}</div>
      </div>
    </section>

    <section class="pane p-peso">
      <div class="card" aria-labelledby="tPeso">
        <h2 class="eyebrow" id="tPeso">Peso de hoje (em jejum)</h2>
        <div class="weight"><input id="peso" inputmode="decimal" placeholder="80.0" value="${p.peso??""}"> <span>kg</span>
          <button class="btn" id="btnPeso">Salvar peso</button>
          <span class="avg">${media?`Média 7 dias: <b class="num">${media} kg</b>`:"Pese 3–4 vezes por semana"}</span></div>
        <div class="saved">${p.peso?`${CHECK_MINI} Salvo hoje: <b class="num">${String(p.peso).replace(".",",")} kg</b>`:(()=>{const u=ultimoPeso();return u?`Último registro: <b class="num">${String(u.peso).replace(".",",")} kg</b> em ${fmtData(u.date)}. Digite o de hoje e ele salva sozinho.`:"Digite o peso e ele salva sozinho.";})()}</div>
      </div>
    </section>
    </div>`;
  document.querySelectorAll(".carousel").forEach(c=>{ if(pos[c.id]) c.scrollLeft=pos[c.id]; atualizarCarrossel(c);
    c.addEventListener("scroll",()=>{cancelAnimationFrame(c._r);c._r=requestAnimationFrame(()=>atualizarCarrossel(c));},{passive:true}); });
  document.querySelectorAll("[data-car]").forEach(b=>b.onclick=()=>{ const c=document.getElementById(b.dataset.car), w=c.firstElementChild.offsetWidth+10;
    c.scrollBy({left:w*(+b.dataset.dir),behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); });
  const nsc=$("#viewHoje .panes"); nsc.scrollLeft=sl; marcarPane();
  nsc.addEventListener("scroll",()=>{cancelAnimationFrame(marcarPane._r);marcarPane._r=requestAnimationFrame(marcarPane);},{passive:true});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ const pane=nsc.children[+b.dataset.go];
    nsc.scrollTo({left:pane.offsetLeft-nsc.offsetLeft-16,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); });
  bindHoje(p);
}
function carrossel(id,label,itens,n){
  return `<div class="car-head"><span class="eyebrow" id="${id}-cnt">1 de ${n}</span>
    <div class="car-nav"><button class="arrow" data-car="${id}" data-dir="-1" aria-label="Anterior">‹</button><button class="arrow" data-car="${id}" data-dir="1" aria-label="Próximo">›</button></div></div>
    <div class="carousel" id="${id}" role="region" aria-label="${label}" tabindex="0">${itens}</div>
    <div class="dots" id="${id}-dots" aria-hidden="true">${Array.from({length:n},(_,i)=>`<i${i===0?' class="on"':""}></i>`).join("")}</div>`;
}
function atualizarCarrossel(el){
  const items=[...el.children]; if(!items.length) return;
  const x=el.scrollLeft; let idx=0,best=1e9;
  items.forEach((it,i)=>{const d=Math.abs(it.offsetLeft-el.firstElementChild.offsetLeft-x); if(d<best){best=d;idx=i;}});
  if(el.scrollLeft+el.clientWidth>=el.scrollWidth-4) idx=items.length-1;
  const c=document.getElementById(el.id+"-cnt"); if(c) c.textContent=`${idx+1} de ${items.length}`;
  document.querySelectorAll(`#${el.id}-dots i`).forEach((d,i)=>d.classList.toggle("on",i===idx));
}
function marcarPane(){
  const sc=$("#viewHoje .panes"); if(!sc) return; const w=sc.clientWidth||1;
  const i=Math.round(sc.scrollLeft/(w-10)); document.querySelectorAll("[data-go]").forEach((b,j)=>b.setAttribute("aria-current",String(j===Math.min(2,i))));
}
function bindHoje(p){
  document.querySelectorAll(".ex input").forEach(inp=>inp.addEventListener("input",e=>{ state.draft.cargas[e.target.dataset.i]=e.target.value.replace(",","."); }));
  document.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>abrirDemo(b.dataset.demo,b.dataset.sets));
  $("#btnFeito").onclick=()=>{ p.status="feito"; commit(p); toast("Treino registrado"); };
  $("#btnPulei").onclick=()=>{ p.status="pulado"; commit(p); toast("Marcado como pulado. Amanhã ele volta."); };
  $("#btnTrocar").onclick=()=>{ const i=ROTACAO.indexOf(p.treinoId); state.treinoOverride=ROTACAO[(i+1)%ROTACAO.length];
    if(state.dias[HOJE]?.treino) commit({...planoHoje(),status:null}); else render(); };
  document.querySelectorAll("[data-meal]").forEach(b=>b.onclick=()=>{ const s=b.dataset.meal; p.refeicoes[s].feito=!p.refeicoes[s].feito; commit(p); });
  document.querySelectorAll("[data-swap]").forEach(b=>b.onclick=()=>{ const s=b.dataset.swap; state.rerolls[s]=(state.rerolls[s]||0)+1; render(); });
  document.querySelectorAll(".seg [data-n]").forEach(b=>b.onclick=()=>{ const n=+b.dataset.n; if(n===nRefeicoes()) return; store.saveConfig({...state.config,nRefeicoes:n}); render(); toast(`${n} refeições por dia`); });
  const salvarPeso=(avisarErro)=>{ const raw=$("#peso").value.trim(); if(!raw) return; const v=parseFloat(raw.replace(",","."));
    if(!(v>30&&v<250)){ if(avisarErro) toast("Digite o peso em kg, ex.: 79,4"); return; }
    if(v===p.peso) return; p.peso=Math.round(v*10)/10; commit(p); toast("Peso salvo"); };
  $("#btnPeso").onclick=()=>salvarPeso(true);
  $("#peso").addEventListener("change",()=>salvarPeso(false));
  $("#peso").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); salvarPeso(true); $("#peso").blur(); } });
  const salvarViagem=(avisarErro)=>{ const v=$("#viagem").value; if(!v){ if(avisarErro) toast("Escolha uma data"); return; }
    if(v===state.config.viagem) return; store.saveConfig({...state.config,viagem:v}); render(); toast("Data da viagem salva"); };
  $("#btnViagem").onclick=()=>salvarViagem(true);
  $("#viagem").addEventListener("change",()=>salvarViagem(false));
}
function commit(p){ const dia=montarDia(p); state.rerolls={}; state.treinoOverride=null; state.draft.cargas={}; store.saveDia(dia); render(); }

function renderHist(){
  const dias=Object.values(state.dias).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);
  const feitos=dias.filter(d=>d.treino?.status==="feito"&&daysBetween(d.date,HOJE)<7).length;
  const rows=dias.map(d=>{
    const dt=fromIso(d.date), refs=Object.values(d.refeicoes||{}), rf=refs.filter(r=>r.feito).length;
    const st=d.treino?.status==="feito"?'<span class="status done">Feito</span>':d.treino?.status==="pulado"?'<span class="status skip">Pulado</span>':'<span class="status todo">—</span>';
    return `<div class="hrow"><div class="d">${dt.getDate()} ${MES[dt.getMonth()]}<small>${DOW[dt.getDay()].slice(0,3)}</small></div>
      <div style="min-width:0"><div class="w">${esc(d.treino?.nome||"Sem treino")}</div><div class="m">${rf}/${refs.length} refeições${d.peso?` · <span class="num">${d.peso} kg</span>`:""}</div></div>${st}</div>`;
  }).join("");
  $("#viewHist").innerHTML=`<section class="card">
    <div class="row" style="justify-content:space-between"><h2 class="eyebrow">Últimos dias</h2><span class="eyebrow">${feitos} treinos nos últimos 7 dias</span></div>
    <div class="hist">${rows||'<p class="empty">Nada registrado ainda. Marque o treino ou uma refeição na aba Hoje e o dia aparece aqui.</p>'}</div></section>
    ${store.mode==="local"?`<section class="card">
      <h2 class="eyebrow">Backup dos seus registros</h2>
      <p class="wfoco small" style="margin:0">Seus registros ficam guardados neste aparelho. Faça um backup de vez em quando e salve em Arquivos ou no iCloud. Se trocar de celular ou apagar o app, é só importar o arquivo.</p>
      ${ehSafariSemIcone()?`<div class="note"><b>Você está no Safari.</b> No iPhone, o Safari e o ícone da tela de início guardam dados separados. Use sempre pelo ícone. Para levar o que salvou aqui, toque em "Salvar backup" e depois importe no app do ícone.</div>`:""}
      ${store.falhou?`<div class="note"><b>O aparelho bloqueou o salvamento.</b> Isso acontece na navegação privada. Abra pelo ícone da tela de início, fora do modo privado.</div>`:""}
      <div class="row"><button class="btn primary" id="btnExport">Salvar backup</button>
        <label class="btn" for="fileImport" style="cursor:pointer">Importar backup</label><input type="file" id="fileImport" accept=".json,application/json" hidden></div>
      <div class="saved">${(n=>n===1?"1 dia registrado":`${n} dias registrados`)(Object.keys(state.dias).length)}${state.config.viagem?` · viagem em ${fmtData(state.config.viagem)}`:""}</div>
    </section>`:""}`;
  bindHist();
}
function ehSafariSemIcone(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone && !matchMedia("(display-mode: standalone)").matches; }
function bindHist(){
  const ex=$("#btnExport"); if(!ex) return;
  ex.onclick=async()=>{
    const dados=JSON.stringify({app:"ontraining",versao:1,exportado:new Date().toISOString(),config:state.config,dias:state.dias},null,1);
    const nome=`ontraining-backup-${HOJE}.json`, file=new File([dados],nome,{type:"application/json"});
    try{ if(navigator.canShare?.({files:[file]})){ await navigator.share({files:[file],title:"Backup OnTraining"}); return; } }catch(e){ if(e.name==="AbortError") return; }
    const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast("Backup gerado");
  };
  $("#fileImport").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{ const d=JSON.parse(await f.text()); if(d.app!=="ontraining"||!d.dias) throw 0;
      state.dias={...state.dias,...d.dias}; store.gravar("ont_dias",state.dias);
      store.saveConfig({...d.config,...state.config,viagem:state.config.viagem||d.config?.viagem});
      render(); toast(`Backup importado: ${(n=>n===1?"1 dia":n+" dias")(Object.keys(d.dias).length)}`);
    }catch(err){ toast("Esse arquivo não é um backup do OnTraining."); }
    e.target.value="";
  };
}
function render(){
  renderHeader();
  if(state.tab==="hoje") renderHoje(); else renderHist();
  $("#viewHoje").hidden=state.tab!=="hoje"; $("#viewHist").hidden=state.tab!=="hist";
  $("#tabHoje").setAttribute("aria-selected",state.tab==="hoje"); $("#tabHist").setAttribute("aria-selected",state.tab==="hist");
  $("#storeInfo").textContent = store.mode==="db" ? "Seus registros ficam salvos na sua conta e aparecem em qualquer aparelho." : (ehSafariSemIcone()?"Registros salvos no Safari deste iPhone. O app do ícone guarda os dele separado.":"Registros salvos neste aparelho.");
}
$("#tabHoje").onclick=()=>{state.tab="hoje";render();};
$("#tabHist").onclick=()=>{state.tab="hist";render();};
$("#mClose").onclick=fecharDemo;
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") fecharDemo(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#modal").hidden) fecharDemo(); });

render();
store.init(render);
</script>

<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
